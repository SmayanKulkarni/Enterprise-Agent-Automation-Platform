name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: ci run id whose functions-zip artifact to deploy; defaults to the latest successful ci run on main
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  resolve:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.artifact_run_id }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -e
          run_id="${INPUT_RUN:-$TRIGGER_RUN}"
          [ -n "$run_id" ] || run_id="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] || { echo "no successful ci run found"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh run view "$run_id" --json headSha --jq .headSha)" >> "$GITHUB_OUTPUT"

  staging:
    needs: resolve
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      run_id: ${{ needs.resolve.outputs.run_id }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  prod:
    needs: [resolve, staging]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      run_id: ${{ needs.resolve.outputs.run_id }}
      sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
