services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./dashboards:/threadline-dashboards:ro
      - ./dashboard-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/threadline.yaml:ro
